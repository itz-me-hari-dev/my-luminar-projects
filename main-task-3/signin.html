<body>
    <div class="sign-in-up-card h-100 d-flex justify-content-center align-items-center">
        <div class="sign-in-up-body w-50">
            <h1 class="sign-in-up-head text-center">Sign In</h1>
            <form>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Your Email Id">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1"placeholder="Enter Your Password">
                </div>
                <div>
                    <button type="submit" class="btn btn-primary d-block mx-auto">Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>
