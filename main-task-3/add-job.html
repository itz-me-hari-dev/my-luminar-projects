<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- bs-css-cdn-end -->

    <!-- bs-js-cdn-start -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script> <!-- bs--js-cdn-end -->

    <!-- font-awesome-cdn-start -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="

    <!-- google-font-link-start -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    <!-- google-font-link-end -->

    <!-- css-custom-start -->
    <link rel="stylesheet" href="./style.css">
    <!-- css-custom-end -->

</head>

<body>
    <div class="container add-job-body mx-auto">
        <h1 class="add-job-heading mt-5">Add a New Job</h1>
        <form class="p-5">
            <div class="form-floating mb-3 w-50 mx-auto">
                <input type="text" class="form-control" id="floatingInput" placeholder="Title">
                <label for="floatingInput">Title</label>
            </div>
            <div class="form-floating mb-3 w-50 mx-auto">
                <input type="text" class="form-control" id="floatingInput" placeholder="Skills">
                <label for="floatingInput">Skills</label>
            </div>
            <div class="form-floating mb-3 w-50 mx-auto">
                <input type="text" class="form-control" id="floatingInput" placeholder="salary">
                <label for="floatingInput">Salary</label>
            </div>
            <div class="form-floating mb-3 w-50 mx-auto">
                <input type="text" class="form-control" id="floatingInput" placeholder="location">
                <label for="floatingInput">Location</label>
            </div>
            <div class="form-floating mb-3 w-50 mx-auto">
                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"
                    style="height: 100px"></textarea>
                <label for="floatingTextarea2">Description</label>
            </div>
            <div class="text-center mt-5">
                <button type="submit" class="btn mx-auto py-5">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
