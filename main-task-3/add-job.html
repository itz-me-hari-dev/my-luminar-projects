<body>

    <!-- nav-section-start -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="./index.html">ELEVATEHIRE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">

            <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">

                    <a class="nav-link  fw-semibold" href="./jobseeker-profile.html">Profile</a>

        </div>
    </nav>
    <!-- nav-section-end -->

    <!-- body-section-start -->
    <div class="container add-job-body my-5 pb-5 mx-auto">
        <h1 class="add-job-heading text-center mb-4">Add a New Job</h1>
        <form class="row g-3 justify-content-center">
            <div class="col-12 col-md-6">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="jobTitle" placeholder="Title">
                    <label for="jobTitle">Title</label>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="skills" placeholder="Skills">
                    <label for="skills">Skills</label>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="salary" placeholder="Salary">
                    <label for="salary">Salary</label>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="location" placeholder="Location">
                    <label for="location">Location</label>
                </div>
            </div>

            <div class="col-12">
                <div class="form-floating mb-3">
                    <textarea class="form-control" placeholder="Leave a comment here" id="description"
                        style="height: 100px"></textarea>
                    <label for="description">Description</label>
                </div>
            </div>

            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-primary px-5 py-2 w-25">Submit</button>
            </div>
        </form>
    </div>
    <!-- body-section-end -->

</body>
