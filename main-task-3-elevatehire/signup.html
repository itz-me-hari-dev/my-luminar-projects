<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP</title>

    <!-- bs--css-cdn-start -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- bs-css-cdn-end -->

    <!-- bs-js-cdn-start -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script> <!-- bs--js-cdn-end -->

    <!-- font-awesome-cdn-start -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- font-awesome-cdn-end -->

    <!-- google-font-link-start -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- google-font-link-end -->

    <!-- css-custom-start -->
    <link rel="stylesheet" href="./style.css">
    <!-- css-custom-end -->

</head>

<body>

    <!-- nav-section-start -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="./index.html">ELEVATEHIRE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
                <div class="navbar-nav align-items-center gap-3">
                    <a class="nav-link  fw-semibold" href="./index.html">Home</a>
                    <a class="nav-link fw-semibold" href="./signin.html">Sign In</a>
                    <a class="nav-link active fw-semibold" href="./signup.html">Sign Up</a>
                    <form class="d-flex" role="search">
                        <input class="form-control rounded-pill" type="search" placeholder="Search">
                    </form>
                </div>
            </div>
        </div>
    </nav>
    <!-- nav-section-end -->


    <!-- body-style-start -->
    <div class="signin-card">
        <div class="p-4 w-100" style="max-width:420px;">

            <h2 class="text-center mb-4">Sign Up</h2>


            <ul class="nav nav-tabs mb-3 justify-content-center" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active text-dark" data-bs-toggle="tab" data-bs-target="#jobseeker"
                        type="button">Jobseeker</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-dark" data-bs-toggle="tab" data-bs-target="#employer"
                        type="button">Employer</button>
                </li>
            </ul>


            <div class="tab-content">

                <!-- jobseeker-section-start -->
                <div class="tab-pane fade show active" id="jobseeker" role="tabpanel">
                    <form action="./jobseeker-profile.html">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="Re-enter your password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                </div>
                <!-- jobseeker-section-end -->


                <!-- employer-section-end -->
                <div class="tab-pane fade" id="employer" role="tabpanel">
                    <form action="./employer-profile.html">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="Re-enter your password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                </div>
                <!-- employer-section-end -->

            </div>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">Already have an account? <a href="./signin.html">Sign In</a></p>
            </div>
        </div>
    </div>
    <!-- signup-body-style-end -->

</body>

</html>
